name: Quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: hamyar_identity_test
          POSTGRES_USER: hamyar_schema
          POSTGRES_PASSWORD: ci_local_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://hamyar_app:ci_app_only@127.0.0.1:5432/hamyar_identity_test
      TEST_MIGRATION_DATABASE_URL: postgresql://hamyar_schema:ci_local_only@127.0.0.1:5432/hamyar_identity_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Create isolated non-owner app role
        env:
          PGPASSWORD: ci_local_only
        run: psql -h 127.0.0.1 -U hamyar_schema -d hamyar_identity_test -c "CREATE ROLE hamyar_app LOGIN PASSWORD 'ci_app_only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS"
      - run: npm run check
      - run: npm run test:integration
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:identity:e2e
