# Local development ONLY. Production requires TLS, TURN, secrets and resource limits.
name: hamyar-dev
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: hamyar
      POSTGRES_USER: hamyar
      POSTGRES_PASSWORD: hamyar_local_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-identity.sql:/docker-entrypoint-initdb.d/identity.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hamyar -d hamyar"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7.4.5-alpine
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  livekit:
    image: livekit/livekit-server:v1.13.9
    command: ["--dev", "--bind", "0.0.0.0", "--node-ip", "127.0.0.1"]
    ports:
      - "127.0.0.1:7880:7880"
      - "127.0.0.1:7881:7881"
      - "127.0.0.1:7882:7882/udp"
volumes:
  postgres_data:
  redis_data:
