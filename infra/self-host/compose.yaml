# Linux deployment of the current web/account/organization slice.
# Media, recording, shared board and email delivery are separate unfinished work.
name: hamyar-self-host
services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hamyar
      POSTGRES_USER: hamyar_bootstrap
      POSTGRES_PASSWORD_FILE: /run/secrets/bootstrap_password
    secrets: [bootstrap_password, schema_password, app_password]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - type: bind
        source: ./init-postgres.sh
        target: /docker-entrypoint-initdb.d/identity.sh
        read_only: true
        bind:
          create_host_path: false
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hamyar_bootstrap -d hamyar"]
      interval: 5s
      timeout: 3s
      retries: 15
    logging:
      options: { max-size: "10m", max-file: "3" }
  migrate:
    image: ${HAMYAR_MIGRATION_IMAGE:?Set a versioned migration image}
    build:
      context: ../..
      target: migration
    profiles: [operations]
    env_file: ./private/migration.env
    depends_on:
      postgres: { condition: service_healthy }
    networks: [database]
    security_opt: [no-new-privileges:true]
  web:
    image: ${HAMYAR_WEB_IMAGE:?Set a versioned web image}
    build:
      context: ../..
      target: runtime
    restart: unless-stopped
    env_file: ./private/runtime.env
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["127.0.0.1:3000:3000"]
    networks: [database, application]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      options: { max-size: "10m", max-file: "3" }
volumes:
  postgres_data:
networks:
  database: { internal: true }
  application: {}
secrets:
  bootstrap_password: { file: ./private/bootstrap-password.txt }
  schema_password: { file: ./private/schema-password.txt }
  app_password: { file: ./private/app-password.txt }
