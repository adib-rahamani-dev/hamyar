# One Linux host: web + PG, optional self-owned media + session gateway.
# Same images in normal/domestic modes. Prepare TLS, DNS and images before isolation.
name: hamyar-self-host
services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hamyar
      POSTGRES_USER: hamyar_bootstrap
      POSTGRES_PASSWORD_FILE: /run/secrets/bootstrap_password
    secrets: [bootstrap_password, schema_password, app_password]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - type: bind
        source: ./init-postgres.sh
        target: /docker-entrypoint-initdb.d/identity.sh
        read_only: true
        bind:
          create_host_path: false
    networks: [database]
    ports: ["127.0.0.1:55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hamyar_bootstrap -d hamyar"]
      interval: 5s
      timeout: 3s
      retries: 15
    logging:
      options: { max-size: "10m", max-file: "3" }
  media:
    image: livekit/livekit-server:v1.13.9
    profiles: [media]
    restart: unless-stopped
    network_mode: host
    command: ["--config", "/etc/livekit.yaml"]
    volumes:
      - type: bind
        source: ./private/livekit.yaml
        target: /etc/livekit.yaml
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ./private/tls
        target: /etc/hamyar-tls
        read_only: true
        bind: { create_host_path: false }
    security_opt: [no-new-privileges:true]
    logging:
      options: { max-size: "10m", max-file: "3" }
  gateway:
    image: ${HAMYAR_GATEWAY_IMAGE:-hamyar-gateway:release-local}
    build: { context: ../.., target: gateway }
    profiles: [media]
    restart: unless-stopped
    network_mode: host
    env_file: ./private/gateway.env
    depends_on:
      postgres: { condition: service_healthy }
      media: { condition: service_started }
    security_opt: [no-new-privileges:true]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8090/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      options: { max-size: "10m", max-file: "3" }
  migrate:
    image: ${HAMYAR_MIGRATION_IMAGE:?Set a versioned migration image}
    build:
      context: ../..
      target: migration
    profiles: [operations]
    env_file: ./private/migration.env
    depends_on:
      postgres: { condition: service_healthy }
    networks: [database]
    security_opt: [no-new-privileges:true]
  web:
    image: ${HAMYAR_WEB_IMAGE:?Set a versioned web image}
    build:
      context: ../..
      target: runtime
    restart: unless-stopped
    env_file: ./private/runtime.env
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["127.0.0.1:3000:3000"]
    networks: [database, application]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      options: { max-size: "10m", max-file: "3" }
volumes:
  postgres_data:
networks:
  database: { internal: true }
  application: {}
secrets:
  bootstrap_password: { file: ./private/bootstrap-password.txt }
  schema_password: { file: ./private/schema-password.txt }
  app_password: { file: ./private/app-password.txt }
